<!doctype html><html><head><meta charset="utf-8"><style>
@font-face{font-family:Jost;src:url(../../site/fonts/jost-400.woff2) format("woff2");font-weight:400;font-display:swap}
@font-face{font-family:Jost;src:url(../../site/fonts/jost-500.woff2) format("woff2");font-weight:500;font-display:swap}
@font-face{font-family:Jost;src:url(../../site/fonts/jost-700.woff2) format("woff2");font-weight:700;font-display:swap}
@font-face{font-family:"DM Mono";src:url(../../site/fonts/dmmono-400.woff2) format("woff2");font-weight:400;font-display:swap}
@font-face{font-family:"DM Mono";src:url(../../site/fonts/dmmono-500.woff2) format("woff2");font-weight:500;font-display:swap}
:root{--mist:#ece7f3;--panel:#f7f4fb;--ink:#241a33;--jade:#00876f;--mul:#a3245e;--slate:#7d7891;--line:#d9d1e6}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;background:var(--mist);color:var(--ink);font:400 18px/1.55 Jost,system-ui,sans-serif;-webkit-font-smoothing:antialiased}
code,pre{font-family:"DM Mono",ui-monospace,monospace;font-size:.84em}
a{color:var(--ink);text-decoration-color:var(--jade);text-decoration-thickness:2px;text-underline-offset:3px}
a:hover{color:var(--jade)}
.skip{position:absolute;left:-999px}.skip:focus{left:12px;top:12px;background:#fff;padding:6px 10px;z-index:9}
:focus-visible{outline:3px solid var(--jade);outline-offset:2px}
.wrap{max-width:1120px;margin:0 auto;padding:0 28px}
.topbar{display:flex;align-items:center;justify-content:space-between;padding:14px 28px;max-width:1260px;margin:0 auto}
.brand{display:flex;align-items:center;gap:10px;font-weight:700;font-size:21px;text-decoration:none;letter-spacing:.01em}
.topbar nav{display:flex;gap:22px;font-weight:500;font-size:16px}
.topbar nav a{text-decoration:none}
.topbar nav a:hover{text-decoration:underline}

/* ---------- network map hero ---------- */
.map{padding:0 16px 8px}
.map-frame{position:relative;max-width:min(1260px,calc((100vh - 86px) * 1.714));margin:0 auto;background:var(--panel);border:2px solid var(--ink);border-radius:2px}
#netmap{display:block;width:100%;height:auto}
.ln{stroke-width:10}
.jade{stroke:var(--jade)}.mul{stroke:var(--mul)}.slate{stroke:var(--slate)}
.ln.bounce{stroke:var(--ink);stroke-width:5;stroke-dasharray:2 11}
.st circle,.st rect{fill:#fff;stroke:var(--ink);stroke-width:4}
.st .disrupted,.st .loopst{stroke:var(--mul)}
.lbl text{font:500 17px Jost,sans-serif;fill:var(--ink)}
.lbl .sub{font:400 13px "DM Mono",monospace;fill:#5d5470}
.lbl .mulc{fill:var(--mul)}
.ntext{font:700 13px Jost,sans-serif;fill:#fff}
.train{fill:var(--ink);stroke:#fff;stroke-width:2.5}
.train.stuck{fill:#fff;stroke:var(--mul);stroke-width:3.5}
.train.back{fill:#fff;stroke:var(--ink);stroke-width:3}
.cartouche{position:absolute;right:2%;top:62%;width:min(38%,440px);background:#fff;border:2px solid var(--ink);padding:18px 22px 16px}
.kicker{margin:0 0 4px;font:500 13px "DM Mono",monospace;color:#5d5470;letter-spacing:.02em}
.cartouche h1{margin:0 0 8px;font:700 clamp(26px,2.6vw,36px)/1.08 Jost,sans-serif;letter-spacing:-.01em}
.lede{margin:0 0 12px;font-size:16px;line-height:1.45}
.key{list-style:none;margin:0;padding:10px 0 0;border-top:1px solid var(--line);display:flex;flex-wrap:wrap;gap:6px 16px;font-size:14px}
.key li{display:flex;align-items:center;gap:7px}
.k{display:inline-block;width:26px;height:6px;border-radius:3px}
.k.jade{background:var(--jade)}.k.mul{background:var(--mul)}.k.slate{background:var(--slate)}
.k.bounce{height:0;border-top:4px dotted var(--ink);border-radius:0}

/* ---------- section headings ---------- */
section{padding:72px 0 8px}
h2{font:700 clamp(26px,3vw,38px)/1.1 Jost,sans-serif;margin:0 0 16px;display:flex;align-items:center;gap:14px;letter-spacing:-.005em}
.bar{display:inline-block;width:44px;height:10px;border-radius:5px;flex:none;box-shadow:0 0 0 4px #fff}
.bar.jade{background:var(--jade)}.bar.mul{background:var(--mul)}.bar.slate{background:var(--slate)}
.intro{max-width:760px;margin:0 0 26px}

/* ---------- status board ---------- */
.board{list-style:none;margin:0;padding:0;border-top:2px solid var(--ink)}
.board li{display:grid;grid-template-columns:14px minmax(170px,1.1fr) 150px 2.2fr;grid-template-rows:auto auto;column-gap:18px;padding:14px 0;border-bottom:1px solid var(--line);align-items:baseline}
.lc{grid-row:1/3;align-self:stretch;width:10px;border-radius:5px}
.lc.mul{background:var(--mul)}.lc.slate{background:var(--slate)}.lc.jade{background:var(--jade)}
.board b{font-weight:700;font-size:19px}
.board em{font-style:normal;font-weight:700;font-size:15px;text-transform:uppercase;letter-spacing:.06em;color:var(--slate)}
.board .sev em{color:var(--mul)}
.board .good em{color:var(--jade)}
.why{font-size:15px;color:#4a4060}
.why code{font-size:13px}
.next{grid-column:4;font-size:15px}
.board li>.why{grid-column:4}
.board li>.next::before{content:"→ ";color:var(--jade);font-weight:700}

/* ---------- strip maps ---------- */
.strip{position:relative;max-width:1180px;margin:10px auto 0;padding:0 20px}
.strip-svg{display:block;width:100%;height:40px;overflow:visible}
.sl{stroke-width:10;stroke-linecap:round;fill:none}
.strain{fill:var(--ink);stroke:#fff;stroke-width:2;opacity:0}
.stops{list-style:none;margin:-30px 0 0;padding:0;display:grid;grid-template-columns:repeat(5,minmax(0,1fr))}
.stops li{padding:0 14px 0 0;text-align:left}
.stops .dot{display:block;width:22px;height:22px;border-radius:50%;background:#fff;border:4px solid var(--ink);margin:0 0 14px 4px;transition:background .25s,transform .25s}
.stops li.lit .dot{background:var(--jade);transform:scale(1.15)}
.stops b{display:block;font-size:22px;font-weight:700}
.stops code{display:block;margin:2px 0 8px;color:var(--jade);font-weight:500}
.stops p{margin:0;font-size:16px;line-height:1.45}
.stops.tools{grid-template-columns:repeat(8,minmax(0,1fr))}
.stops.tools li{height:150px}
.stops.tools b{font:500 14px "DM Mono",monospace;display:inline-block;white-space:nowrap;transform:rotate(38deg);transform-origin:0 0;margin-left:14px}

/* ---------- qshape matrix ---------- */
.two{display:grid;grid-template-columns:1fr 1.35fr;gap:48px;align-items:start}
.mono-note{color:#4a4060;font-size:16px}
.matrix{background:#fff;border:2px solid var(--ink);padding:16px 16px 10px;overflow-x:auto}
.mx{display:grid;grid-template-columns:150px repeat(11,minmax(26px,1fr));align-items:center;row-gap:6px;min-width:520px}
.mx .h{font:500 12px "DM Mono",monospace;color:#5d5470;text-align:center}
.mx .d{font:500 15px Jost,sans-serif;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;padding-right:8px}
.mx .c{display:flex;justify-content:center;align-items:center;height:30px}
.mx .c i{display:block;border-radius:50%;background:var(--mul);transform:scale(0);transition:transform .35s cubic-bezier(.3,1.4,.6,1)}
.mx.on .c i{transform:scale(1)}
.mx .t{font:500 13px "DM Mono",monospace;text-align:center}

/* ---------- MCP configs ---------- */
.agents .strip{margin-top:4px}
.cfgs{display:grid;grid-template-columns:repeat(auto-fit,minmax(320px,1fr));gap:18px;margin-top:20px}
.cfg{margin:0;background:#fff;border:2px solid var(--ink);border-left:10px solid var(--jade);padding:14px 16px;font-size:13px;line-height:1.5;overflow-x:auto;white-space:pre-wrap;word-break:break-word}
.cfg .c{color:#6d6480}

/* ---------- points ---------- */
.pl{stroke-width:10;fill:none;stroke-linecap:round;stroke-linejoin:round}
#siding{transition:stroke .3s}
.points.open #siding{stroke:var(--mul)}
#blade{transform-origin:170px 70px;transition:transform .5s cubic-bezier(.5,0,.2,1)}
.points.open #blade{transform:rotate(45deg)}
#shackle{transition:transform .35s}
.points.open #shackle{transform:translate(7px,-5px) rotate(28deg)}
.pt{font:500 16px Jost,sans-serif;fill:var(--ink)}.pt.sm{font:400 13px "DM Mono",monospace}
.lever{margin-top:12px;font:500 15px "DM Mono",monospace;background:#fff;color:var(--ink);border:2px solid var(--ink);padding:10px 16px;cursor:pointer;border-radius:22px}
.lever span{display:inline-block;margin-left:10px;padding:1px 10px;border-radius:10px;background:var(--slate);color:#fff}
.lever[aria-pressed=true] span{background:var(--mul)}

/* ---------- install ---------- */
.nameboard{position:relative;background:#fff;border:2px solid var(--ink);padding:20px 22px 20px 30px;max-width:820px;margin:8px 0 18px}
.nb-line{position:absolute;left:0;top:0;bottom:0;width:12px;background:var(--jade)}
.nameboard pre{margin:0;font-size:15px;line-height:1.8;white-space:pre-wrap;word-break:break-all}
.nameboard .p{color:var(--jade);user-select:none}
.links{font-weight:500}
footer{padding:64px 0 40px;font-size:14px;color:#5d5470}

@media (max-width:860px){
  body{font-size:17px}
  .topbar nav{gap:14px;font-size:15px}
  .topbar nav a:nth-child(-n+2){display:none}
  .map-scroll{overflow-x:auto;-webkit-overflow-scrolling:touch}
  #netmap{min-width:720px}
  .cartouche{position:static;width:auto;border:0;border-top:2px solid var(--ink)}
  .stops.tools li{height:auto}
  .board li{grid-template-columns:10px 1fr;row-gap:2px}
  .board li>b,.board li>em,.board li>.why,.board li>.next{grid-column:2}
  .lc{grid-row:1/5}
  .stops{grid-template-columns:1fr;margin:0;padding-left:36px;position:relative}
  .strip-svg{display:none}
  .stops::before{content:"";position:absolute;left:9px;top:8px;bottom:8px;width:10px;border-radius:5px;background:var(--jade)}
  .stops li{position:relative;padding:0 0 22px}
  .stops .dot{position:absolute;left:-34px;top:4px;margin:0}
  .stops.tools{grid-template-columns:1fr}
  .stops.tools b{writing-mode:horizontal-tb;transform:none;height:auto;margin:0}
  .two,.cfgs{grid-template-columns:1fr;gap:24px}
  section{padding-top:56px}
}
@media (prefers-reduced-motion:reduce){
  html{scroll-behavior:auto}
  *,*::before,*::after{transition:none!important;animation:none!important}
}

html,body{margin:0;width:var(--w);height:var(--h);overflow:hidden}
body{background:var(--mist)}
.og{position:relative;width:var(--w);height:var(--h);box-sizing:border-box;padding:22px;}
.og .frame{position:relative;width:100%;height:100%;background:var(--panel);border:3px solid var(--ink);overflow:hidden}
.og #netmap{position:absolute;left:-30px;top:-50px;width:1240px;height:auto}
.og .cart{position:absolute;right:26px;bottom:26px;width:520px;background:#fff;border:3px solid var(--ink);padding:24px 28px 20px}
.og .name{display:flex;align-items:center;gap:14px;font:700 46px/1 Jost;margin:0 0 10px}
.og .name img{width:58px;height:58px}
.og h1{font:700 34px/1.1 Jost;margin:0 0 10px}
.og p{font:400 19px/1.4 Jost;margin:0 0 12px}
.og .meta{font:500 15px "DM Mono";color:#5d5470;margin:0}
